<body>
    <script>
        // finding lcm of two number
        function lcm(a,b){
            let x=a,y=b;
            while(x!=y){
                if(x<y){
                    x+=a;
                }else{
                    y+=b;
                }
            }
            console.log(`LCM is:- ${x}`);
            
        }
        let lcM=lcm(3,20);
        console.log(lcM);
        
        
        
    </script>
</body>
