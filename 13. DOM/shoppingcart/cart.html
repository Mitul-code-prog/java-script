<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - MiniShop</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #1e293b;
        }

        .navbar {
            background: #1e293b;
            color: white;
            padding: 22px 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar h1 {
            font-size: 25px;
        }

        .navbar h1 span {
            color: #38bdf8;
        }

        .back-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-btn:hover {
            background: #0ea5e9;
            color: white;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h2 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #64748b;
            font-size: 15px;
        }

        #cart {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .cart-item {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 24px;
            display: grid;
            grid-template-columns: 90px 1fr auto;
            align-items: center;
            gap: 22px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.05);
        }

        .product-icon {
            width: 85px;
            height: 85px;
            background: #eff6ff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
        }

        .product-info h3 {
            font-size: 21px;
            text-transform: capitalize;
            margin-bottom: 9px;
        }

        .unit-price {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .quantity-control button {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 7px;
            background: #e2e8f0;
            color: #1e293b;
            font-size: 20px;
            cursor: pointer;
        }

        .quantity-control button:hover {
            background: #cbd5e1;
        }

        .quantity-control span {
            font-weight: bold;
            font-size: 15px;
        }

        .item-actions {
            text-align: right;
        }

        .item-total {
            font-size: 21px;
            font-weight: bold;
            color: #0284c7;
            margin-bottom: 18px;
        }

        .delete-btn {
            border: 1px solid #fecaca;
            color: #dc2626;
            background: #fef2f2;
            padding: 9px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-btn:hover {
            background: #fee2e2;
        }

        .summary {
            background: white;
            margin-top: 25px;
            padding: 25px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.05);
        }

        .summary h3 {
            font-size: 17px;
            color: #64748b;
            margin-bottom: 12px;
        }

        .summary h2 {
            font-size: 30px;
            color: #0284c7;
        }

        #display {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 55px 20px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .empty-icon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        #display h2 {
            margin-bottom: 10px;
            font-size: 24px;
        }

        #display p {
            color: #64748b;
            margin-bottom: 22px;
        }

        .shop-btn {
            background: #1e293b;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .shop-btn:hover {
            background: #334155;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            padding: 30px 15px;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 18px;
            }

            .navbar h1 {
                font-size: 21px;
            }

            .back-btn {
                padding: 10px 12px;
            }

            .container {
                margin: 28px auto;
                padding: 0 14px;
            }

            .heading h2 {
                font-size: 25px;
            }

            .cart-item {
                grid-template-columns: 65px 1fr;
                gap: 15px;
                padding: 16px;
            }

            .product-icon {
                width: 65px;
                height: 65px;
                font-size: 33px;
            }

            .product-info h3 {
                font-size: 18px;
            }

            .item-actions {
                grid-column: 1 / -1;
                border-top: 1px solid #e2e8f0;
                padding-top: 15px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .item-total {
                margin-bottom: 0;
                font-size: 19px;
            }

            .summary h2 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <h1>Mini<span>Shop.</span></h1>

        <button class="back-btn" onclick="window.location.href='index.html'">
            ← Continue Shopping
        </button>
    </header>

    <main class="container">
        <div class="heading">
            <h2>🛒 My Shopping Cart</h2>
            <p>Review your products and manage quantities.</p>
        </div>

        <div id="cart"></div>

        <div id="display">
            <div class="empty-icon">🛍️</div>
            <h2>Your cart is empty!</h2>
            <p>Looks like you haven't added any products yet.</p>
            <button class="shop-btn"
                onclick="window.location.href='index.html'">
                Start Shopping
            </button>
        </div>
    </main>

    <footer class="footer">
        MiniShop &copy; 2026. All rights reserved.
    </footer>

    <script>
        let cart = JSON.parse(localStorage.getItem("cartdata")) || [];

        const dmsg = document.getElementById("display");
        const cartprint = document.getElementById("cart");

        function cqty(index, num) {
            if (cart[index].qty + num < 0) return false;

            cart[index].qty += num;

            localStorage.setItem("cartdata", JSON.stringify(cart));

            renderCart();
        }

        function calculateTotal() {
            return cart.reduce(
                (total, v) => total + v.price * v.qty,
                0
            );
        }

        function remove(index) {
            cart.splice(index, 1);

            localStorage.setItem("cartdata", JSON.stringify(cart));

            renderCart();
        }

        function renderCart() {
            cartprint.innerHTML = "";

            if (cart.length === 0) {
                dmsg.style.display = "block";
            } else {
                dmsg.style.display = "none";

                cartprint.innerHTML = cart
                    .map((i, index) => {
                        const productIcon =
                            i.name === "maggie" ? "🍜" : "💧";

                        return `
                            <div class="cart-item">

                                <div class="product-icon">
                                    ${productIcon}
                                </div>

                                <div class="product-info">
                                    <h3>${i.name}</h3>

                                    <p class="unit-price">
                                        Price per item: ₹${i.price}
                                    </p>

                                    <div class="quantity-control">
                                        <button
                                            onclick="cqty(${index}, -1)">
                                            −
                                        </button>

                                        <span>Qty: ${i.qty}</span>

                                        <button
                                            onclick="cqty(${index}, 1)">
                                            +
                                        </button>
                                    </div>
                                </div>

                                <div class="item-actions">
                                    <div class="item-total">
                                        ₹${i.qty * i.price}
                                    </div>

                                    <button
                                        class="delete-btn"
                                        onclick="remove(${index})">
                                        🗑 Delete
                                    </button>
                                </div>

                            </div>
                        `;
                    })
                    .join("");

                let summary = document.createElement("div");
                summary.className = "summary";

                summary.innerHTML = `
                    <h3>Order Summary</h3>
                    <h2>Total: ₹${calculateTotal()}</h2>
                `;

                cartprint.appendChild(summary);
            }
        }

        renderCart();
    </script>

</body>
</html>
