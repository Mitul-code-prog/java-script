<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div align="center">
        <input type="text" id="name" placeholder="Enter the name">
        <input type="number" id="age" placeholder="Enter your age">
        <button onclick="add()">Add</button>
       
    </div>
    <br>
    <br>
    <table border="black" width="50%" align="center" id="table">
        <tr>
            <th>Name</th>
            <th>Age</th>
        </tr>
    </table>
    <script>
        
       let root=document.getElementById("table");
       

       function generateElement(){
            let addRow=document.createElement("tr");
            let addCol1=document.createElement("td");
            let addCol2=document.createElement("td");
            return {addRow,addCol1,addCol2};
       }

       let add=()=>{
            let inputName=document.getElementById("name").value;
            let inputAge=document.getElementById("age").value;
            if(inputName==="" || inputAge===""){
                alert("add both")
                return false;
            }
            let {addRow,addCol1,addCol2} =generateElement();
            addCol1.innerText=inputName;
            addCol2.innerText=inputAge;
           
            addRow.addEventListener("dblclick",()=>{
                addRow.remove();
            })
            addRow.appendChild(addCol1);
            addRow.appendChild(addCol2);
             root.appendChild(addRow);
            alert("added!!");

            
       }
      

        

    </script>
</body>
</html>
