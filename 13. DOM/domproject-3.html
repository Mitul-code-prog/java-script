<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(133, 133, 224);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; 
            font-family: sans-serif;
        }
        
        .box{
            width: 50%;
            height: 50vh;
            border-radius: 15px;
            box-shadow: 0px 0px 8px rgb(105, 102, 102);
            margin: 0 auto;
            background-color: white;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            h1{
              
                text-align: center;
            }
            div{
                
                text-align: center;
                
            }
            button {
            padding: 8px 16px;
            font-size: 15px;
            color: red;
            margin: 0 5px;
            cursor: pointer;
            border-radius: 50px;
            border: 1px solid #ccc;
            background-color: #f0f0f0;
        }
        
        button:hover {
            background-color: #e0e0e0;
        }
           
            
        }
    </style>
</head>
<body>
    <div class="box">
        <h1 id="count">Count is:-0</h1>
        <br>
        <div>
            <button onclick="count()">+</button>
            <button onclick="down()">-</button>
            <button onclick="reset()">Reset</button>
        </div>
    </div>
    <script>
        let no=0;
        let count=()=>{
            no++;
            let add=document.getElementById("count");
            add.innerHTML=`Count is:- ${no}`

        }
        let down=()=>{
            no--;
            let add=document.getElementById("count");
            add.innerHTML=`Count is:- ${no}`

        }
        let reset=()=>{
            no=0;
            let add=document.getElementById("count");
            add.innerHTML=`Count is:- ${no}`
        }
    </script>
</body>
</html>
