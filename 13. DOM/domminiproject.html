<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" placeholder="Enter city name" id="in-field">
    <br>
    <button onclick="add()">Add</button>
    <button onclick="dlt()">Delete</button>
    <ul id="list"></ul>
    <script>
       
        
       let add=()=>{
            let city=document.getElementById("in-field").value;
            if(city===""){
                alert("add name");
                return false
            }
            let ulist=document.getElementById('list');
            let sublist=document.createElement("li");
            ulist.appendChild(sublist);
            sublist.innerHTML=city;
            alert("item added");
            // for removing written in field
            document.getElementById("in-field").value="";
        }
        let dlt=()=>{
            document.getElementById("list").remove();
        }


    </script>
</body>
</html>
