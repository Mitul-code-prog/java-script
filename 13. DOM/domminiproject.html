<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" placeholder="Enter city name" id="in-field">
    <br>
    <button onclick="add()">Add</button>
    <button onclick="dlt()">DeleteAll</button>
    <ul id="list"></ul>
    <script>
       
        
       let add=()=>{
            let city=document.getElementById("in-field").value;
            if(city===""){
                alert("add name");
                return false
            }
            let ulist=document.getElementById('list');
            let sublist=document.createElement("li");
            sublist.setAttribute('class','dltm')
            ulist.appendChild(sublist);
            sublist.innerHTML=city;
            let btn=document.createElement("button");
            btn.innerHTML="Delete";
            sublist.appendChild(btn);
            btn.addEventListener("click",()=>{
                sublist.remove()
            })
        
            alert("item added");
            // for removing written in field
            document.getElementById("in-field").value="";
        }
        let dlt=()=>{
            let d=document.querySelectorAll(".dltm");
            for(j of d){
                j.remove();
            }
        }


    </script>
</body>
</html>
