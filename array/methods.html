<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 1.Push
        let color=["grey","green","white"];
        color.push("blue");
        console.log(color);

        // 2.Pop
        color.pop();
        console.log(color);

        // 3.unshift
        color.unshift(2345);
        console.log(color);

        // 4.shift
        color.shift();
        console.log(color);
        
    </script>
</body>
</html>
